title: Grove Suite
description: The infrastructure layer that makes AI coding agents production-safe.
theme: just-the-docs

url: https://tabladrum.github.io
baseurl: /grove-suite

permalink: pretty

# Just the Docs theme settings
color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true

aux_links:
  "GitHub":
    - "https://github.com/tabladrum/grove-suite"

heading_anchors: true

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

nav_sort: case_sensitive

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md  # rendered via index.md instead

defaults:
  - scope:
      path: ""
    values:
      layout: default

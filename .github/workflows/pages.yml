name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Run JS-based actions on the Node 24 runtime (GitHub forces this 2026-06-16);
# silences the Node 20 deprecation warnings from upload-pages-artifact's
# transitive upload-artifact@v3.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Jekyll and theme
        working-directory: docs
        run: |
          gem install bundler
          cat > Gemfile <<'EOF'
          source 'https://rubygems.org'
          gem 'jekyll', '~> 4.3'
          gem 'just-the-docs', '~> 0.10'
          gem 'jekyll-remote-theme'
          gem 'jekyll-seo-tag'
          EOF
          bundle install

      - name: Build with Jekyll
        working-directory: docs
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

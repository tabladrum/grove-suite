# SOC2 baseline profile
# Trust Service Criteria CC7.x mapped to relay gates.
relay_version: v1
stack: generic
policies:
  secrets:
    scope: ["**/*"]
    deny: ["aws-access-key-id", "github-token", "slack-webhook-url"]
  coverage:
    min_pct: 70.0
  deps:
    block_severity: ["critical", "high"]
  fileclass:
    deny: ["**/*.pem", "**/*.p12", "**/credentials.json"]

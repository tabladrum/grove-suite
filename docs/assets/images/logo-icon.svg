<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Grove Suite">
  <title>Grove Suite</title>

  <!-- Edges — drawn under nodes so circles cleanly cover line ends -->
  <!-- Root → mid-left -->
  <line x1="24" y1="8" x2="11" y2="24" stroke="#166534" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.65"/>
  <!-- Root → mid-right -->
  <line x1="24" y1="8" x2="37" y2="24" stroke="#166534" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.65"/>
  <!-- Mid-left → bot-left -->
  <line x1="11" y1="24" x2="5" y2="41" stroke="#166534" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.65"/>
  <!-- Mid-left → bot-center -->
  <line x1="11" y1="24" x2="24" y2="41" stroke="#166534" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.65"/>
  <!-- Mid-right → bot-center (cross-edge: makes this a graph, not just a tree) -->
  <line x1="37" y1="24" x2="24" y2="41" stroke="#166534" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.65"/>

  <!-- Nodes — largest to smallest, darkest to lightest -->
  <!-- Root: query entry point -->
  <circle cx="24" cy="8"  r="6"   fill="#0d3320"/>
  <!-- Mid level: primary dependencies -->
  <circle cx="11" cy="24" r="4.5" fill="#166534"/>
  <circle cx="37" cy="24" r="4.5" fill="#166534"/>
  <!-- Leaf level: indexed symbols -->
  <circle cx="5"  cy="41" r="3.5" fill="#22c55e"/>
  <circle cx="24" cy="41" r="3.5" fill="#22c55e"/>
</svg>

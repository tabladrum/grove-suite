<!-- SVG favicon — works in all modern browsers -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/logo-icon.svg' | relative_url }}">
<!-- PNG fallback for older browsers -->
<link rel="alternate icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">

<!-- Open Graph / social preview -->
<meta property="og:title"       content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image"       content="{{ '/assets/images/logo.svg' | absolute_url }}">
<meta property="og:type"        content="website">
<meta name="twitter:card"       content="summary">

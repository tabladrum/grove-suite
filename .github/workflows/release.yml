name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v0.1.0) — for manual test runs only"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26.3"
  # Run JS-based actions on the Node 24 runtime (GitHub forces this 2026-06-16);
  # silences the Node 20 deprecation warnings from upload-artifact et al.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ----------------------------------------------------------------------------
  # Linux: ubuntu-latest builds amd64 natively; arm64 via gcc-aarch64-linux-gnu.
  # CGO is required because Grove and Fuse depend on go-tree-sitter (CGO).
  # ----------------------------------------------------------------------------
  build-linux:
    name: Build linux/${{ matrix.goarch }} ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [grove, prism, fuse, relay]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install arm64 cross-compiler (arm64 builds only)
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "stripped=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ matrix.module }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
        run: |
          mkdir -p ../dist
          OUT="${{ matrix.module }}-${{ steps.ver.outputs.version }}-linux-${{ matrix.goarch }}"
          go build \
            -ldflags="-s -w -X github.com/tabladrum/grove-suite/${{ matrix.module }}/internal/version.Version=${{ steps.ver.outputs.stripped }}" \
            -o "../dist/${OUT}" \
            ./cmd/${{ matrix.module }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.module }}-linux-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

  # ----------------------------------------------------------------------------
  # macOS: macos-latest is Apple Silicon (arm64). amd64 cross-compiles with
  # clang's -arch flag. Apple's clang supports both architectures natively.
  # ----------------------------------------------------------------------------
  build-darwin:
    name: Build darwin/${{ matrix.goarch }} ${{ matrix.module }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        module: [grove, prism, fuse, relay]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "stripped=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ matrix.module }}
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.goarch == 'amd64' && 'clang -arch x86_64' || 'clang -arch arm64' }}
        run: |
          mkdir -p ../dist
          OUT="${{ matrix.module }}-${{ steps.ver.outputs.version }}-darwin-${{ matrix.goarch }}"
          go build \
            -ldflags="-s -w -X github.com/tabladrum/grove-suite/${{ matrix.module }}/internal/version.Version=${{ steps.ver.outputs.stripped }}" \
            -o "../dist/${OUT}" \
            ./cmd/${{ matrix.module }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.module }}-darwin-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Windows: windows-latest ships with MinGW-w64 gcc available on the runner.
  # CGO_ENABLED=1 picks it up automatically.
  # ----------------------------------------------------------------------------
  build-windows:
    name: Build windows/amd64 ${{ matrix.module }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module: [grove, prism, fuse, relay]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "stripped=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ matrix.module }}
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist
          OUT="${{ matrix.module }}-${{ steps.ver.outputs.version }}-windows-amd64.exe"
          go build \
            -ldflags="-s -w -X github.com/tabladrum/grove-suite/${{ matrix.module }}/internal/version.Version=${{ steps.ver.outputs.stripped }}" \
            -o "../dist/${OUT}" \
            ./cmd/${{ matrix.module }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.module }}-windows-amd64
          path: dist/
          retention-days: 1

  # ----------------------------------------------------------------------------
  # VS Code extension — pure Node.js, no platform dependency.
  # ----------------------------------------------------------------------------
  build-vsix:
    name: Build VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: prism/vscode-extension/package-lock.json

      - name: Package VSIX
        run: |
          cd prism/vscode-extension
          npm ci
          npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: prism-vsix
          path: prism/vscode-extension/*.vsix
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Release: gather artifacts, generate checksums, publish.
  # ----------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-linux, build-darwin, build-windows, build-vsix]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "grove-suite ${{ github.ref_name }}"
          body: |
            ## grove-suite ${{ github.ref_name }}

            ### Binaries

            | Binary | linux/amd64 | linux/arm64 | darwin/amd64 | darwin/arm64 | windows/amd64 |
            |--------|:-----------:|:-----------:|:------------:|:------------:|:-------------:|
            | grove  | ✅ | ✅ | ✅ | ✅ | ✅ |
            | prism  | ✅ | ✅ | ✅ | ✅ | ✅ |
            | fuse   | ✅ | ✅ | ✅ | ✅ | ✅ |
            | relay  | ✅ | ✅ | ✅ | ✅ | ✅ |

            Download per-OS binaries below. Verify with `checksums.txt`.

            ### Install (macOS / Linux)

            ```bash
            # Example: install grove on macOS Apple Silicon
            VERSION=${{ github.ref_name }}
            curl -L https://github.com/tabladrum/grove-suite/releases/download/${VERSION}/grove-${VERSION}-darwin-arm64 -o grove
            chmod +x grove
            sudo mv grove /usr/local/bin/
            grove version
            ```

            Repeat for `prism`, `fuse`, `relay` as needed. See [the installation guide](https://tabladrum.github.io/grove-suite/installation) for the full per-OS instructions including Windows.

            ### Install (Windows)

            Download `<binary>-${{ github.ref_name }}-windows-amd64.exe` from the assets below and move it to a folder on your `PATH` (e.g. `C:\Users\<you>\bin`).

            ### VS Code Extension

            Download `prism-vscode-*.vsix` and install via `Extensions: Install from VSIX...` in VS Code.

            ### Verify

            ```bash
            curl -L https://github.com/tabladrum/grove-suite/releases/download/${{ github.ref_name }}/checksums.txt -o checksums.txt
            sha256sum -c checksums.txt --ignore-missing
            ```
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

title: Relay
description: Certified delivery for AI coding agents — every AI-generated commit signed, tested, and traceable to the prompt that created it. Built on Grove, Prism, and Fuse (MIT). Local-first.
theme: just-the-docs

logo: "assets/images/logo.svg"

url: https://tabladrum.github.io
baseurl: /grove-suite

permalink: pretty

# Just the Docs theme settings
color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true

aux_links:
  "GitHub":
    - "https://github.com/tabladrum/grove-suite"

heading_anchors: true

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

nav_sort: case_sensitive

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules

defaults:
  - scope:
      path: ""
    values:
      layout: default

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Run JS-based actions on the Node 24 runtime (GitHub forces this 2026-06-16);
# silences the Node 20 deprecation warnings from setup-go/upload-artifact et al.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: prism/vscode-extension/package-lock.json

      - name: Verify modules
        run: go work sync

      - name: Vet all modules
        run: go vet ./astkit/... ./grove/... ./fuse/... ./prism/... ./relay/...

      - name: Test astkit
        run: cd astkit && go test ./... -count=1 -timeout 120s

      - name: Test grove
        run: cd grove && go test ./... -count=1 -short -timeout 120s

      - name: Test fuse
        run: cd fuse && go test ./... -count=1 -timeout 180s

      - name: Test prism
        run: cd prism && go test ./... -count=1 -timeout 120s

      - name: Test relay
        run: cd relay && go test ./... -count=1 -timeout 120s

      - name: Build VS Code extension
        run: |
          cd prism/vscode-extension
          npm ci
          npm run compile

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Fuse coverage (>=85%)
        run: |
          cd fuse
          go test ./... -count=1 -timeout 180s -coverprofile=/tmp/fuse.cov
          TOTAL=$(go tool cover -func=/tmp/fuse.cov | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Fuse coverage: ${TOTAL}%"
          awk "BEGIN { if ($TOTAL < 85) { print \"FAIL: coverage \" $TOTAL \"% < 85%\"; exit 1 } }"

      - name: Grove coverage (>=80%)
        run: |
          cd grove
          go test ./... -count=1 -short -timeout 120s -coverprofile=/tmp/grove.cov
          TOTAL=$(go tool cover -func=/tmp/grove.cov | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Grove coverage: ${TOTAL}%"
          awk "BEGIN { if ($TOTAL < 80) { print \"FAIL: coverage \" $TOTAL \"% < 80%\"; exit 1 } }"

      - name: Prism coverage (>=84%)
        run: |
          cd prism
          go test ./... -count=1 -timeout 120s -coverprofile=/tmp/prism.cov
          TOTAL=$(go tool cover -func=/tmp/prism.cov | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Prism coverage: ${TOTAL}%"
          awk "BEGIN { if ($TOTAL < 84) { print \"FAIL: coverage \" $TOTAL \"% < 84%\"; exit 1 } }"
